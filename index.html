<style>
  :root {
    --bg-void: #05070A;
    --ice-100: #EAF4FB;
    --ice-400: #8FA4B8;

    --accent: #79D6FF;
    --accent2: #5B8CFF;
    --mint: #6EE7C6;
    --amber: #F5B971;
    --danger: #FF8A8A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-void); }
  body { font-family: 'Inter', sans-serif; color: var(--ice-100); }
  #root { min-height: 100vh; position: relative; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }
  input, textarea, button { font-family: 'Inter', sans-serif; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font-family: inherit; }

  @keyframes wa-fall { 0% { transform: translate(0, -5vh); } 100% { transform: translate(var(--drift), 105vh); } }
  @keyframes wa-fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes wa-popin { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes wa-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .wa-fadein { animation: wa-fadein 0.6s ease both; }
  .wa-stepfade { animation: wa-fadein 0.35s ease both; }
  .wa-overlay { animation: wa-fadein 0.25s ease both; }
  .wa-modalcard { animation: wa-popin 0.3s ease both; }

  .wa-btn { transition: transform .15s ease, filter .15s ease, background .15s ease; }
  .wa-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .wa-btn:active { transform: translateY(0) scale(0.98); }

  .wa-hoverlift { transition: transform .2s ease; }
  .wa-hoverlift:hover { transform: translateY(-3px); }

  .wa-navbtn { transition: background .15s ease, color .15s ease; }

  @media (max-width: 900px) {
    .wa-sidebar { display: none !important; }
    .wa-mobilenav { display: flex !important; }
    .wa-dash-top, .wa-dash-grid, .wa-workout-grid, .wa-progress-grid, .wa-ach-grid, .wa-journal-grid, .wa-settings-grid, .wa-challenge-grid {
      grid-template-columns: 1fr !important;
    }
    .wa-daylabel { display: block !important; }
    .wa-hero-grid { grid-template-columns: 1fr !important; }
    .wa-feature-grid { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 560px) {
    .wa-feature-grid { grid-template-columns: 1fr !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>

const pad = (n) => String(n).padStart(2, "0");
const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const addDays = (d, n) => { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; };
const startOfDay = (d) => { const nd = new Date(d); nd.setHours(0,0,0,0); return nd; };
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);

function emptyDay() {
  return { workoutDone: false, workoutCategory: null, habits: {}, water: 0, sleep: null, journal: null };
}

function computeDayScore(day, profile) {
  if (!day) return 0;
  const workoutScore = day.workoutDone ? 25 : 0;
  const habitIds = (profile?.habits || []).map((h) => h.id);
  const total = habitIds.length || 1;
  const checked = habitIds.filter((id) => day.habits?.[id]).length;
  const habitsScore = habitIds.length ? Math.round((checked / total) * 25) : 0;
  const waterGoal = profile?.waterGoal || 2500;
  const waterScore = Math.min(20, Math.round((day.water / waterGoal) * 20));
  const sleepTarget = profile?.sleepTarget || 8;
  const sleepScore = day.sleep?.hours ? Math.min(30, Math.round((day.sleep.hours / sleepTarget) * 30)) : 0;
  return Math.min(100, workoutScore + habitsScore + waterScore + sleepScore);
}

function computeStreak(days, profile) {
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const key = dateKey(cursor);
    const score = computeDayScore(days[key], profile);
    if (score > 0) { streak++; cursor = addDays(cursor, -1); }
    else break;
  }
  return streak;
}

function xpFromState(days, profile) {
  let xp = 0;
  Object.values(days).forEach((day) => {
    if (day.workoutDone) xp += 20;
    const habitIds = (profile?.habits || []).map((h) => h.id);
    xp += habitIds.filter((id) => day.habits?.[id]).length * 5;
    if (day.water >= (profile?.waterGoal || 2500)) xp += 10;
    if (day.sleep?.hours) xp += 10;
  });

}

/* ============================================================================
   ANIMATION HELPERS (vanilla, no framer-motion)
============================================================================ */

function useAnimatedNumber(target, duration = 900) {
  const [value, setValue] = useState(target);
  const fromRef = useRef(target);
  const targetRef = useRef(target);
  useEffect(() => {
    fromRef.current = value;
    targetRef.current = target;
    let start = null;
    let raf;
    const step = (ts) => {
      if (!start) start = ts;
      const t = Math.min(1, (ts - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setValue(fromRef.current + (targetRef.current - fromRef.current) * eased);
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [target, duration]);
  return value;
}

function useReducedMotion() {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    try {
      const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
      setReduced(mq.matches);
      const fn = (e) => setReduced(e.matches);
      mq.addEventListener?.("change", fn);
      return () => mq.removeEventListener?.("change", fn);
    } catch (e) {}
  }, []);
  return reduced;
}

function useInView(options) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setInView(true); obs.disconnect(); }
    }, options || { threshold: 0.15 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function SectionReveal({ children, delay = 0 }) {
  const [ref, inView] = useInView();
  return (
    <div ref={ref} style={{
      opacity: inView ? 1 : 0,
      transform: inView ? "translateY(0)" : "translateY(28px)",
      transition: `opacity .7s ease ${delay}s, transform .7s ease ${delay}s`,
    }}>
      {children}
    </div>
  );
}

function SnowField({ count = 34 }) {
  const reduced = useReducedMotion();
  const flakes = useMemo(() => Array.from({ length: count }).map((_, i) => ({
    id: i,
    left: Math.random() * 100,
    size: 2 + Math.random() * 3,
    dur: 14 + Math.random() * 18,
    delay: -(Math.random() * 20),
    drift: (Math.random() - 0.5) * 60,
    op: 0.15 + Math.random() * 0.35,
  })), [count]);
  if (reduced) return null;
  return (
    <div aria-hidden="true" style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 0 }}>
      {flakes.map((f) => (
        <span key={f.id} style={{
          position: "absolute", top: -10, left: `${f.left}%`, width: f.size, height: f.size,
          borderRadius: "50%", background: "#DCEEFB", opacity: f.op, filter: "blur(0.3px)",
          animation: `wa-fall ${f.dur}s linear infinite`, animationDelay: `${f.delay}s`, "--drift": `${f.drift}px`,

function ArcRing({ percent = 0, size = 160, stroke = 10, label, sublabel, accentId = "a" }) {
  const animated = useAnimatedNumber(percent, 1100);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const gapFraction = 0.22;
  const usable = c * (1 - gapFraction);
  const offset = usable - (usable * Math.min(100, Math.max(0, animated))) / 100;
  const rot = 90 + (360 * gapFraction) / 2;
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <defs>
          <linearGradient id={`grad-${accentId}`} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#79D6FF" />
            <stop offset="100%" stopColor="#5B8CFF" />
          </linearGradient>
          <filter id={`glow-${accentId}`}>
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={stroke}
          strokeDasharray={`${usable} ${c}`} strokeLinecap="round" transform={`rotate(${rot} ${size / 2} ${size / 2})`} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={`url(#grad-${accentId})`} strokeWidth={stroke}
          strokeDasharray={`${usable} ${c}`} strokeDashoffset={offset} strokeLinecap="round"
          filter={`url(#glow-${accentId})`} transform={`rotate(${rot} ${size / 2} ${size / 2})`} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
        {label && <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: size * 0.16, color: "#F2F8FC", lineHeight: 1 }}>{label}</div>}
        {sublabel && <div style={{ fontSize: 11, color: "#7E97AC", marginTop: 4, letterSpacing: 1 }}>{sublabel}</div>}
      </div>
    </div>
  );
}

/* ============================================================================
   MINI CHARTS (custom SVG, no chart library)
============================================================================ */

function MiniAreaChart({ data, dataKey, color = "#79D6FF", height = 220 }) {
  const w = 600;
  const max = Math.max(1, ...data.map((d) => d[dataKey]));
  const n = Math.max(1, data.length - 1);
  const stepX = w / n;
  const pts = data.map((d, i) => [i * stepX, height - 20 - (d[dataKey] / max) * (height - 40)]);
  const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = `${line} L ${pts[pts.length - 1][0].toFixed(1)},${height - 20} L 0,${height - 20} Z`;
  const gid = "grad_" + dataKey;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.5" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0, 1, 2, 3].map((i) => (
        <line key={i} x1="0" x2={w} y1={20 + (i * (height - 40)) / 3} y2={20 + (i * (height - 40)) / 3} stroke="rgba(255,255,255,0.06)" />
      ))}
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

function MiniBarChart({ data, dataKey, color = "#5B8CFF", height = 180 }) {
  const w = 600;
  const max = Math.max(1, ...data.map((d) => d[dataKey]));
  const gap = w / data.length;
  const bw = gap * 0.55;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      {[0, 1, 2].map((i) => (<line key={i} x1="0" x2={w} y1={10 + (i * (height - 30)) / 2} y2={10 + (i * (height - 30)) / 2} stroke="rgba(255,255,255,0.06)" />))}
      {data.map((d, i) => {
        const bh = Math.max(2, (d[dataKey] / max) * (height - 30));
        return <rect key={i} x={i * gap + (gap - bw) / 2} y={height - 20 - bh} width={bw} height={bh} rx={3} fill={color} opacity="0.9" />;
      })}
    </svg>
  );
}

                  <Chip key={d} selected={form.duration === d} onClick={() => setForm({ ...form, duration: d })} label={d} compact />

          {step === 4 && (

            <div>

                <div style={qlabel}>Water goal: {(form.waterGoal / 1000).toFixed(1)}L</div>

              </div>
            </div>
          )}
          {step === 6 && (
            <div>
              <h2 style={qh}>Which habits matter to you?</h2>
              <p style={qsub}>You can add custom habits later.</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {DEFAULT_HABITS.map((h) => (
                  <Chip key={h.id} selected={form.habits.includes(h.id)} onClick={() => toggle("habits", h.id)} label={h.name} />
                ))}
              </div>
            </div>
          )}
          {step === 7 && (
            <div>
              <h2 style={qh}>Your Winter Arc is ready, {form.name || "there"}.</h2>
              <p style={qsub}>A 90-day arc begins the moment you confirm.</p>
              <Glass style={{ padding: 20, marginTop: 10 }}>
                <ReviewRow label="Experience" value={form.experience} />
                <ReviewRow label="Goals" value={form.goals.map((g) => GOAL_OPTIONS.find((o) => o.id === g)?.label).join(", ")} />

              </Glass>
            </div>
          )}
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 40 }}>
          <Button variant="ghost" onClick={() => (step === 0 ? onCancel() : setStep(step - 1))} icon={ChevronLeft}>{step === 0 ? "Cancel" : "Back"}</Button>
          {step < steps.length - 1 ? (
            <Button onClick={() => canNext() && setStep(step + 1)} style={{ opacity: canNext() ? 1 : 0.5 }}>Continue</Button>
          ) : (
            <Button icon={Sparkles} onClick={() => onComplete({ ...form, habits: DEFAULT_HABITS.filter((h) => form.habits.includes(h.id)) })}>ENTER THE ARC</Button>

function WorkoutSession({ category, onExit, onFinish }) {
  const w = WORKOUT_LIBRARY[category];
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState("exercise");
  const [restLeft, setRestLeft] = useState(0);
  const [completedSets, setCompletedSets] = useState({});
  const timerRef = useRef(null);

  useEffect(() => {
    if (phase === "resting" && restLeft > 0) {
      timerRef.current = setTimeout(() => setRestLeft((r) => r - 1), 1000);
    } else if (phase === "resting" && restLeft === 0) {
      setPhase("exercise");
    }
    return () => clearTimeout(timerRef.current);
  }, [phase, restLeft]);

  const ex = w.exercises[idx];
  const key = `${idx}`;
  const setsDone = completedSets[key] || 0;

  const completeSet = () => {
    const next = setsDone + 1;
    setCompletedSets((c) => ({ ...c, [key]: next }));
    if (next >= ex.sets) {
      if (idx < w.exercises.length - 1) {
        setIdx(idx + 1);
        if (ex.rest > 0) { setPhase("resting"); setRestLeft(ex.rest); } else setPhase("exercise");
      } else {
        setPhase("done");
      }
    } else {
      if (ex.rest > 0) { setPhase("resting"); setRestLeft(ex.rest); } else setPhase("exercise");
    }
  };

  const skip = () => {
    if (idx < w.exercises.length - 1) { setIdx(idx + 1); setPhase("exercise"); }
    else setPhase("done");
  };

  if (phase === "done") {
    return (
      <div style={pagewrap}>
        <Glass style={{ padding: 50, textAlign: "center", maxWidth: 480, margin: "60px auto" }}>
          <Trophy size={36} color="#F5B971" style={{ margin: "0 auto" }} />
          <h2 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 24, color: "#F2F8FC", marginTop: 18 }}>{category} complete.</h2>
          <p style={{ fontSize: 13.5, color: "#8FA4B8", marginTop: 8 }}>Logged to today. +20 discipline XP.</p>
          <div style={{ marginTop: 26 }}><Button onClick={onFinish} icon={Check}>Done</Button></div>
        </Glass>
      </div>
    );
  }

  return (
    <div style={pagewrap}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 }}>
        <button onClick={onExit} style={{ background: "none", border: "none", color: "#8FA4B8", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", fontSize: 13 }}><ChevronLeft size={16} /> Exit session</button>

function WaterBottle({ percent }) {
  const animated = useAnimatedNumber(percent, 1000);
  const h = 140;
  const fillH = Math.min(100, Math.max(0, animated)) / 100 * (h - 14);
  return (
    <svg width="70" height={h + 10} viewBox={`0 0 70 ${h + 10}`}>
      <defs>
        <clipPath id="bottleClip"><rect x="14" y="8" width="42" height={h - 8} rx="14" /></clipPath>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#8FE1FF" />
          <stop offset="100%" stopColor="#3E7CB1" />
        </linearGradient>
      </defs>
      <rect x="26" y="0" width="18" height="12" rx="4" fill="rgba(255,255,255,0.15)" />
      <rect x="14" y="8" width="42" height={h - 8} rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" strokeWidth="1.5" />
      <g clipPath="url(#bottleClip)">
        <rect x="14" y={h - fillH + 8} width="42" height={fillH} fill="url(#waterGrad)" />
      </g>
    </svg>
  );
}

function Progress({ days, profile }) {
  const [range, setRange] = useState("week");
  const rangeDays = range === "week" ? 7 : range === "month" ? 30 : ARC_LENGTH;

  const chartData = useMemo(() => {
    return Array.from({ length: rangeDays }).map((_, i) => {
      const d = addDays(new Date(), -(rangeDays - 1) + i);
      const dk = dateKey(d);
      const day = days[dk] || emptyDay();
      return {
        label: rangeDays <= 7 ? d.toLocaleDateString(undefined, { weekday: "short" }) : `${d.getMonth() + 1}/${d.getDate()}`,
        score: computeDayScore(day, profile),
        water: Math.round((day.water / 1000) * 100) / 100,
        sleep: day.sleep?.hours || 0,
        habits: Object.values(day.habits || {}).filter(Boolean).length,
      };
    });
  }, [days, profile, rangeDays]);

  return (
    <div style={pagewrap}>
      <PageHeader title="Progress" subtitle="Consistency across every metric that matters." />
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {[["week", "THIS WEEK"], ["month", "THIS MONTH"], ["arc", "WINTER ARC"]].map(([id, label]) => (
          <button key={id} className="wa-btn" onClick={() => setRange(id)} style={{
            padding: "8px 16px", borderRadius: 10, fontSize: 12, cursor: "pointer",
            background: range === id ? "rgba(127,216,255,0.12)" : "rgba(255,255,255,0.04)",
            border: range === id ? "1px solid rgba(127,216,255,0.4)" : "1px solid rgba(255,255,255,0.08)",
            color: range === id ? "#8FE1FF" : "#8FA4B8",
          }}>{label}</button>
        ))}
      </div>

      <Glass style={{ padding: 22, marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: "#6E8296", marginBottom: 14 }}>WINTER SCORE TREND</div>
        <MiniAreaChart data={chartData} dataKey="score" color="#79D6FF" height={220} />
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: "#5C7082", marginTop: 6 }}>
          <span>{chartData[0]?.label}</span><span>{chartData[chartData.length - 1]?.label}</span>
        </div>
      </Glass>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }} className="wa-progress-grid">
        <Glass style={{ padding: 22 }}>
          <div style={{ fontSize: 12, color: "#6E8296", marginBottom: 14 }}>HYDRATION (L)</div>
          <MiniBarChart data={chartData} dataKey="water" color="#5B8CFF" height={180} />
        </Glass>
        <Glass style={{ padding: 22 }}>
          <div style={{ fontSize: 12, color: "#6E8296", marginBottom: 14 }}>SLEEP (HOURS)</div>
          <MiniBarChart data={chartData} dataKey="sleep" color="#8FE1FF" height={180} />
        </Glass>
      </div>
    </div>
  );
}

function CalendarPage({ days, profile }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selected, setSelected] = useState(null);
  const base = new Date(); base.setMonth(base.getMonth() + monthOffset); base.setDate(1);
  const year = base.getFullYear(), month = base.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  const stateFor = (d) => {
    const dk = dateKey(d);
    const score = computeDayScore(days[dk], profile);
    if (d > new Date()) return "future";
    if (score >= 60) return "complete";
    if (score > 0) return "partial";
    return "rest";
  };

  return (
    <div style={pagewrap}>
      <PageHeader title="Calendar" subtitle="Every day of your arc, at a glance." />
      <Glass style={{ padding: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <button className="wa-btn" onClick={() => setMonthOffset((m) => m - 1)} style={navBtn}><ChevronLeft size={16} /></button>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 16, color: "#EAF4FB" }}>{base.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</div>
          <button className="wa-btn" onClick={() => setMonthOffset((m) => m + 1)} style={navBtn}><ChevronRight size={16} /></button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 8 }}>
          {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div key={i} style={{ textAlign: "center", fontSize: 10.5, color: "#5C7082" }}>{d}</div>)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const st = stateFor(d);
            const isToday = dateKey(d) === todayKey();
            const colors = { complete: "rgba(110,231,198,0.18)", partial: "rgba(245,185,113,0.16)", rest: "rgba(255,255,255,0.03)", future: "transparent" };
            const borders = { complete: "1px solid rgba(110,231,198,0.4)", partial: "1px solid rgba(245,185,113,0.35)", rest: "1px solid rgba(255,255,255,0.06)", future: "1px solid rgba(255,255,255,0.03)" };
            return (
              <button key={i} onClick={() => st !== "future" && setSelected(d)} style={{
                aspectRatio: "1", borderRadius: 10, background: colors[st], border: isToday ? "1px solid #79D6FF" : borders[st],
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: st === "future" ? "default" : "pointer", gap: 2,
              }}>
                <span style={{ fontSize: 12, color: st === "future" ? "#3A4552" : "#C7D8E5" }}>{d.getDate()}</span>
                {st === "complete" && <Check size={10} color="#6EE7C6" />}
                {st === "partial" && <MinusCircle size={10} color="#F5B971" />}
              </button>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 16, marginTop: 18, fontSize: 11, color: "#8FA4B8" }}>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><Check size={11} color="#6EE7C6" /> Completed</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><MinusCircle size={11} color="#F5B971" /> Partial</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}>— Rest / no data</span>
        </div>
      </Glass>

      {selected && <DayDetailModal date={selected} day={days[dateKey(selected)]} profile={profile} onClose={() => setSelected(null)} />}
    </div>
  );
}

const MOODS = ["😞", "😐", "🙂", "😄", "🔥"];

function Journal({ days, saveJournal }) {
  const [mood, setMood] = useState(3);
  const [energy, setEnergy] = useState(3);
  const [notes, setNotes] = useState("");
  const [wentWell, setWentWell] = useState("");
  const [improve, setImprove] = useState("");

  const entries = useMemo(() => Object.entries(days)
    .filter(([, d]) => d.journal)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1))
    .slice(0, 30), [days]);

  const submit = () => {
    saveJournal({ mood, energy, notes, wentWell, improve, time: new Date().toISOString() });
    setNotes(""); setWentWell(""); setImprove("");
  };

  return (
    <div style={pagewrap}>
      <PageHeader title="Journal" subtitle="How did today go?" />
      <Glass style={{ padding: 24, marginBottom: 22 }}>
        <div style={{ display: "flex", gap: 20, marginBottom: 20, flexWrap: "wrap" }}>
          <div>
            <div style={qlabel}>Mood</div>
            <div style={{ display: "flex", gap: 6 }}>
              {MOODS.map((m, i) => (
                <button key={i} onClick={() => setMood(i)} style={{ fontSize: 20, padding: 8, borderRadius: 10, background: mood === i ? "rgba(127,216,255,0.14)" : "transparent", border: mood === i ? "1px solid rgba(127,216,255,0.4)" : "1px solid transparent", cursor: "pointer" }}>{m}</button>
              ))}
            </div>
          </div>
          <div style={{ flex: 1, minWidth: 160 }}>
            <div style={qlabel}>Energy: {energy}/5</div>
            <input type="range" min="1" max="5" value={energy} onChange={(e) => setEnergy(Number(e.target.value))} style={{ width: "100%", accentColor: "#79D6FF" }} />
          </div>
        </div>
        <textarea placeholder="Notes for today..." value={notes} onChange={(e) => setNotes(e.target.value)} style={{ ...qinput, minHeight: 70, resize: "vertical", fontFamily: "'Inter',sans-serif" }} />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 12 }} className="wa-journal-grid">
          <textarea placeholder="What went well?" value={wentWell} onChange={(e) => setWentWell(e.target.value)} style={{ ...qinput, minHeight: 60, resize: "vertical" }} />
          <textarea placeholder="What should improve tomorrow?" value={improve} onChange={(e) => setImprove(e.target.value)} style={{ ...qinput, minHeight: 60, resize: "vertical" }} />
        </div>
        <div style={{ marginTop: 16 }}><Button onClick={submit} icon={BookOpen}>Save entry</Button></div>
      </Glass>

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {entries.length === 0 && <EmptyState icon={BookOpen} text="No entries yet. Your first reflection starts the timeline." />}

  );

          </div>
        </div>
        <div style={{ marginTop: 14 }}><Button size="sm" onClick={() => updateProfile(local)}>Save profile</Button></div>
      </Glass>

      <Glass style={{ padding: 24, marginBottom: 16 }}>
        <SettingsSection title="Goals & Targets" />
        <div style={{ marginBottom: 20 }}>
          <div style={qlabel}>Sleep target: {local.sleepTarget}h</div>
          <input type="range" min="5" max="10" step="0.5" value={local.sleepTarget} onChange={(e) => setLocal({ ...local, sleepTarget: Number(e.target.value) })} style={{ width: "100%", accentColor: "#79D6FF" }} />
        </div>
        <div>
          <div style={qlabel}>Water goal: {(local.waterGoal / 1000).toFixed(1)}L</div>
          <input type="range" min="1500" max="4000" step="250" value={local.waterGoal} onChange={(e) => setLocal({ ...local, waterGoal: Number(e.target.value) })} style={{ width: "100%", accentColor: "#79D6FF" }} />
        </div>
        <div style={{ marginTop: 14 }}><Button size="sm" onClick={() => updateProfile(local)}>Save targets</Button></div>
      </Glass>

      <Glass style={{ padding: 24, marginBottom: 16 }}>
        <SettingsSection title="Preferences" />
        <ToggleRow label="Sound feedback" checked={soundOn} onChange={setSoundOn} />
        <ToggleRow label="Notifications" checked={notifOn} onChange={setNotifOn} />
      </Glass>

      <Glass style={{ padding: 24, marginBottom: 16 }}>
        <SettingsSection title="Data" />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <Button size="sm" variant="secondary" icon={Download} onClick={exportData}>Export data (JSON)</Button>
          <Button size="sm" variant="danger" icon={Trash2} onClick={() => setConfirmReset(true)}>Reset Winter Arc</Button>
        </div>
      </Glass>

      <ConfirmDialog
        open={confirmReset}
        title="Reset your Winter Arc?"
        body="This clears all logged days, streaks, journal entries, XP, and achievements. Your profile stays. This can't be undone."
        confirmLabel="Reset everything"
        danger
        onCancel={() => setConfirmReset(false)}
        onConfirm={() => { resetArc(); setConfirmReset(false); }}
      />
    </div>
  );
}

function SettingsSection({ title }) {
  return <div style={{ fontSize: 12, letterSpacing: 1.2, color: "#6E8296", marginBottom: 18 }}>{title.toUpperCase()}</div>;
}

function ToggleRow({ label, checked, onChange }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0" }}>
      <span style={{ fontSize: 13.5, color: "#C7D8E5" }}>{label}</span>
      <button onClick={() => onChange(!checked)} style={{ width: 42, height: 24, borderRadius: 99, background: checked ? "linear-gradient(90deg,#79D6FF,#5B8CFF)" : "rgba(255,255,255,0.1)", border: "none", cursor: "pointer", position: "relative", transition: "background .2s" }}>
        <div style={{ width: 18, height: 18, borderRadius: 99, background: "#fff", position: "absolute", top: 3, left: checked ? 20 : 2, transition: "left .2s" }} />
      </button>
    </div>
  );
}

function PageHeader({ title, subtitle }) {
  return (
    <div style={{ marginBottom: 22, paddingTop: 14 }}>
      <h1 style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 26, color: "#F2F8FC", margin: 0 }}>{title}</h1>
      {subtitle && <p style={{ fontSize: 13.5, color: "#8FA4B8", marginTop: 6 }}>{subtitle}</p>}
    </div>
  );
}

/* ============================================================================
   SLEEP LOG MODAL
============================================================================ */

function SleepLogModal({ initial, sleepTarget, onSave, onClose }) {
  const [bedtime, setBedtime] = useState(initial?.bedtime || "23:00");
  const [wake, setWake] = useState(initial?.wake || "07:00");
  const [quality, setQuality] = useState(initial?.quality || 3);

  const hours = useMemo(() => {
    const [bh, bm] = bedtime.split(":").map(Number);
    const [wh, wm] = wake.split(":").map(Number);
    let mins = (wh * 60 + wm) - (bh * 60 + bm);
    if (mins <= 0) mins += 24 * 60;
    return Math.round((mins / 60) * 10) / 10;
  }, [bedtime, wake]);

  return (
    <div className="wa-overlay" style={{ position: "fixed", inset: 0, background: "rgba(3,5,8,0.7)", backdropFilter: "blur(4px)", zIndex: 150, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <div className="wa-modalcard" onClick={(e) => e.stopPropagation()}>
        <Glass style={{ padding: 28, width: 400, maxWidth: "90vw" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
            <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 17, color: "#EAF4FB" }}>Log sleep</div>
            <button onClick={onClose} style={{ background: "none", border: "none", color: "#6E8296", cursor: "pointer" }}><X size={18} /></button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 18 }}>
            <div>
              <div style={qlabel}>Bedtime</div>
              <input type="time" value={bedtime} onChange={(e) => setBedtime(e.target.value)} style={{ ...qinput, padding: "10px 12px" }} />
            </div>
            <div>
              <div style={qlabel}>Wake time</div>
              <input type="time" value={wake} onChange={(e) => setWake(e.target.value)} style={{ ...qinput, padding: "10px 12px" }} />
            </div>
          </div>
          <div style={{ marginBottom: 18 }}>
            <div style={qlabel}>Sleep quality: {["Poor", "Rough", "Okay", "Good", "Great"][quality - 1]}</div>
            <input type="range" min="1" max="5" value={quality} onChange={(e) => setQuality(Number(e.target.value))} style={{ width: "100%", accentColor: "#79D6FF" }} />
          </div>
          <Glass style={{ padding: 14, marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 12.5, color: "#8FA4B8" }}>Total sleep</span>
            <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 16, color: "#79D6FF", fontWeight: 700 }}>{hours}h</span>
          </Glass>
          <div style={{ fontSize: 11.5, color: "#5C7082", marginBottom: 18, lineHeight: 1.4 }}>Sleep needs vary. Consistency matters more than any single number — target is {sleepTarget}h.</div>
          <Button onClick={() => onSave({ bedtime, wake, hours, quality })} icon={Check}>Save sleep log</Button>
        </Glass>
      </div>
    </div>
  );
}

/* ============================================================================
   FOCUS MODE
============================================================================ */

function FocusMode({ onExit, today, dayIndex }) {
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(false);
  const [quote] = useState(() => QUOTES[Math.floor(Math.random() * QUOTES.length)]);

  useEffect(() => {
    if (!running) return;
    const t = setInterval(() => setSeconds((s) => s + 1), 1000);
    return () => clearInterval(t);
  }, [running]);

  const mm = pad(Math.floor(seconds / 60));
  const ss = pad(seconds % 60);

  return (
    <div className="wa-overlay" style={{ position: "fixed", inset: 0, background: "#04060A", zIndex: 500, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
      <SnowField count={24} />
      <button onClick={onExit} style={{ position: "absolute", top: 26, right: 26, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, width: 38, height: 38, color: "#9FB4C6", cursor: "pointer", zIndex: 2 }}><X size={17} /></button>
      <div style={{ position: "relative", zIndex: 1, textAlign: "center" }}>
        <div style={{ fontSize: 12, letterSpacing: 2, color: "#6E8296", marginBottom: 14 }}>ARC DAY {Math.min(dayIndex, ARC_LENGTH)} · TODAY'S OBJECTIVE</div>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 32, color: "#F2F8FC", marginBottom: 40 }}>{today.workoutCategory || "Show up."}</div>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 72, color: "#79D6FF", letterSpacing: 2 }}>{mm}:{ss}</div>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 30 }}>
          <Button onClick={() => setRunning((r) => !r)} icon={running ? Pause : Play}>{running ? "Pause" : "Start"}</Button>
          <Button variant="secondary" onClick={() => { setSeconds(0); setRunning(false); }} icon={RotateCcw}>Reset</Button>
        </div>
        <div style={{ marginTop: 60, fontSize: 15, color: "#5C7082", fontStyle: "italic" }}>"{quote}"</div>
      </div>
    </div>
  );
}

/* ============================================================================
   ROOT APP
============================================================================ */

function WinterArcApp() {
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("landing");
  const [page, setPage] = useState("dashboard");
  const [focusMode, setFocusMode] = useState(false);
  const [toast, setToast] = useState(null);
  const [soundOn, setSoundOn] = useState(true);
  const [notifOn, setNotifOn] = useState(true);
  const exploreRef = useRef(null);

  const [profile, setProfile] = useState(null);
  const [days, setDays] = useState({});
  const [arcStartDate, setArcStartDate] = useState(null);
  const [bestStreakStored, setBestStreakStored] = useState(0);
  const [challenges, setChallenges] = useState([]);
  const [sleepModalOpen, setSleepModalOpen] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.profile) { setProfile(parsed.profile); setView("app"); }
        setDays(parsed.days || {});
        setArcStartDate(parsed.arcStartDate || null);
        setBestStreakStored(parsed.bestStreak || 0);
        setChallenges(parsed.challenges || []);
        setSoundOn(parsed.soundOn ?? true);
        setNotifOn(parsed.notifOn ?? true);
      }
    } catch (e) {}
    setLoading(false);
  }, []);

  useEffect(() => {
    if (loading || !profile) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile, days, arcStartDate, bestStreak: bestStreakStored, challenges, soundOn, notifOn }));
    } catch (e) {}
  }, [profile, days, arcStartDate, bestStreakStored, challenges, soundOn, notifOn, loading]);

  const today = days[todayKey()] || emptyDay();
  const dayIndex = arcStartDate ? daysBetween(new Date(arcStartDate), new Date()) + 1 : 1;
  const streak = useMemo(() => computeStreak(days, profile), [days, profile]);
  const bestStreak = Math.max(streak, bestStreakStored);
  const score = computeDayScore(today, profile);
  const xp = useMemo(() => xpFromState(days, profile), [days, profile]);
  const level = Math.floor(xp / 100) + 1;
  const totalActiveDays = useMemo(() => Object.values(days).filter((d) => computeDayScore(d, profile) > 0).length, [days, profile]);

  useEffect(() => { if (streak > bestStreakStored) setBestStreakStored(streak); }, [streak, bestStreakStored]);

  const derived = { dayIndex, bestStreak, totalActiveDays };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  const updateToday = (patch) => {
    const dk = todayKey();
    setDays((d) => ({ ...d, [dk]: { ...(d[dk] || emptyDay()), ...patch } }));
  };

  const toggleHabit = (id) => {
    const dk = todayKey();
    setDays((d) => {
      const cur = d[dk] || emptyDay();
      const nowChecked = !cur.habits[id];
      if (nowChecked) showToast("Habit checked ✓");
      return { ...d, [dk]: { ...cur, habits: { ...cur.habits, [id]: nowChecked } } };
    });
  };

  const addHabit = (name) => {
    setProfile((p) => ({ ...p, habits: [...p.habits, { id: `h_${Date.now()}`, name }] }));
  };

  const completeWorkout = (category) => {
    updateToday({ workoutDone: true, workoutCategory: category });
    showToast(`${category} logged. +20 XP`);
  };

  const saveJournal = (entry) => {
    updateToday({ journal: entry });
    showToast("Journal entry saved");
  };

  const toggleChallenge = (id) => {
    setChallenges((c) => (c.includes(id) ? c.filter((x) => x !== id) : [...c, id]));
  };

  const exportData = () => {
    const payload = { profile, days, arcStartDate, bestStreak: bestStreakStored, xp, challenges };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "winter-arc-data.json"; a.click();
    URL.revokeObjectURL(url);
    showToast("Data exported");
  };

  const resetArc = () => {
    setDays({});
    setArcStartDate(new Date().toISOString());
    setBestStreakStored(0);
    setChallenges([]);
    showToast("Winter Arc reset. Day 1 starts now.");
  };

  const completeOnboarding = (form) => {
    setProfile(form);
    setArcStartDate(new Date().toISOString());
    setView("app");
    showToast(`Welcome, ${form.name}. Your arc begins.`);
  };

  if (loading) {
    return (
      <div style={{ minHeight: "100vh", background: "#05070A", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ animation: "wa-spin 1.6s linear infinite" }}>
          <Snowflake size={26} color="#79D6FF" />
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#05070A", color: "#EAF4FB", fontFamily: "'Inter',sans-serif", position: "relative" }}>
      {view === "landing" && (
        <Landing onStart={() => setView("onboarding")} onExplore={() => exploreRef.current?.scrollIntoView({ behavior: "smooth" })} exploreRef={exploreRef} />
      )}

      {view === "onboarding" && (
        <Onboarding onComplete={completeOnboarding} onCancel={() => setView("landing")} />
      )}

      {view === "app" && profile && (
        <div style={{ display: "flex" }}>
          <Sidebar page={page} setPage={setPage} profile={profile} streak={streak} setFocusMode={setFocusMode} />
          <div style={{ flex: 1, minWidth: 0, position: "relative" }}>
            <SnowField count={16} />
            <div style={{ position: "relative", zIndex: 1 }}>
              <Topbar profile={profile} dayIndex={dayIndex} soundOn={soundOn} setSoundOn={setSoundOn} />
              <div key={page} className="wa-stepfade">
                {page === "dashboard" && (
                  <Dashboard profile={profile} today={today} dayIndex={dayIndex} streak={streak} bestStreak={bestStreak} score={score} updateToday={updateToday} setPage={setPage} onLogSleep={() => setSleepModalOpen(true)} />
                )}
                {page === "workouts" && <Workouts profile={profile} today={today} completeWorkout={completeWorkout} />}
                {page === "habits" && <Habits profile={profile} days={days} today={today} toggleHabit={toggleHabit} addHabit={addHabit} />}
                {page === "progress" && (
                  <>
                    <Progress days={days} profile={profile} />
                    <div style={pagewrap}><Challenges joined={challenges} toggleChallenge={toggleChallenge} /></div>
                  </>
                )}
                {page === "calendar" && <CalendarPage days={days} profile={profile} />}
                {page === "achievements" && <Achievements derived={derived} xp={xp} level={level} />}
                {page === "journal" && <Journal days={days} saveJournal={saveJournal} />}
                {page === "settings" && (
                  <Settings profile={profile} updateProfile={setProfile} exportData={exportData} resetArc={resetArc} soundOn={soundOn} setSoundOn={setSoundOn} notifOn={notifOn} setNotifOn={setNotifOn} />
                )}
              </div>
            </div>
          </div>
          <MobileNav page={page} setPage={setPage} />
        </div>
      )}

      {focusMode && <FocusMode onExit={() => setFocusMode(false)} today={today} dayIndex={dayIndex} />}

      {sleepModalOpen && (
        <SleepLogModal
          initial={today.sleep}
          sleepTarget={profile?.sleepTarget || 8}
          onClose={() => setSleepModalOpen(false)}
          onSave={(sleep) => { updateToday({ sleep }); setSleepModalOpen(false); showToast("Sleep logged"); }}
        />
      )}

      <Toast toast={toast} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<WinterArcApp />);
</script>
</body>
</html>
