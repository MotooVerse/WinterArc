<style>
  :root {

    --line: rgba(255,255,255,0.09);

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-void); }
  body { font-family: 'Instrument Sans', sans-serif; color: var(--ice-100); -webkit-font-smoothing: antialiased; }
  h1,h2,h3 { font-family: 'Space Grotesk', sans-serif; }
  button { font-family: inherit; }
  input, textarea { font-family: 'Instrument Sans', sans-serif; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }
  input[type="range"] { accent-color: #79D6FF; width: 100%; }

  @keyframes wa-fall { 0% { transform: translate(0,-5vh); } 100% { transform: translate(var(--drift), 105vh); } }
  @keyframes wa-fadein { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
  @keyframes wa-popin { from { opacity:0; transform: scale(0.94) translateY(8px); } to { opacity:1; transform: scale(1) translateY(0); } }
  @keyframes wa-burst { from { transform: translate(0,0) scale(1); opacity: var(--op,1); } to { transform: translate(var(--tx), var(--ty)) scale(0.25); opacity: 0; } }

  @keyframes wa-blink { 0%,100% { opacity:1; } 50% { opacity:0.25; } }
  @keyframes wa-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  .wa-fadein { animation: wa-fadein 0.6s ease both; }
  .wa-stepfade { animation: wa-fadein 0.35s ease both; }
  .wa-overlay { animation: wa-fadein 0.25s ease both; }
  .wa-modalcard { animation: wa-popin 0.3s ease both; }
  .wa-btn { transition: transform .15s ease, filter .15s ease, background .15s ease; }
  .wa-btn:hover { filter: brightness(1.07); }
  .wa-btn:active { transform: scale(0.98); }

  /* layout */
  .wa-sidebar { position: fixed; left:0; top:0; bottom:0; width:236px; padding:22px 14px; display:flex; flex-direction:column; gap:3px;
    background: rgba(8,12,18,0.75); backdrop-filter: blur(20px); border-right:1px solid rgba(255,255,255,0.06); z-index:20; }
  .wa-main { margin-left:236px; padding:26px 34px 90px; position:relative; z-index:1; }
  .wa-main-inner { max-width:1160px; margin:0 auto; }
  .wa-mobilenav { position:fixed; bottom:0; left:0; right:0; display:none; justify-content:space-around; z-index:50;
    background: rgba(6,9,14,0.94); backdrop-filter: blur(18px); border-top:1px solid rgba(255,255,255,0.08);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom)); }
  .wa-mobilenav button { display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:#5C7082; font-size:10px; letter-spacing:0.4px; cursor:pointer; padding:6px 10px; border-radius:10px; }
  .wa-mobilenav button.active { color:#8FE1FF; background: rgba(127,214,255,0.08); }

  .wa-navitem { display:flex; align-items:center; gap:11px; padding:10px 13px; border-radius:12px; border:none; background:none;
    color:var(--ice-400); font-size:13.5px; font-weight:500; cursor:pointer; text-align:left; transition: background .15s, color .15s; }
  .wa-navitem:hover { background: rgba(255,255,255,0.05); color: var(--ice-100); }
  .wa-navitem.active { background: rgba(127,214,255,0.10); color: #EAF4FB; box-shadow: inset 2px 0 0 #79D6FF; }

  /* grids */
  .wa-hero-grid { display:grid; grid-template-columns:1.05fr 0.95fr; gap:50px; align-items:center; }
  .wa-feature-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .wa-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .wa-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .wa-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }

  /* chips & inputs */
  .wa-chip { display:inline-flex; align-items:center; gap:8px; padding:11px 16px; border-radius:12px; cursor:pointer;
    background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:var(--ice-300); font-size:13.5px; font-weight:500;
    transition: all .15s ease; }
  .wa-chip:hover { border-color: rgba(143,225,255,0.4); }
  .wa-chip.sel { background: rgba(127,214,255,0.12); border-color: rgba(127,214,255,0.55); color:#EAF4FB; }
  .wa-chip.wide { width:100%; justify-content:flex-start; }
  .wa-input { width:100%; padding:13px 15px; border-radius:12px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1); color:var(--ice-100); font-size:14.5px; outline:none; resize:vertical; }
  .wa-input::placeholder { color:#5C7082; }

  /* set dots */
  .wa-setdot { width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.04);
    color:var(--ice-400); font-family:'JetBrains Mono',monospace; font-size:13px; cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center; transition: all .15s ease; }
  .wa-setdot:hover { border-color: rgba(143,225,255,0.6); }
  .wa-setdot.done { background:#7FD4FF; border-color:#8FE1FF; color:#04121F; font-weight:700; }

  @media (max-width:1100px) { .wa-stats { grid-template-columns: repeat(2,1fr); } .wa-grid-3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width:900px) {
    .wa-sidebar { display:none; }
    .wa-mobilenav { display:flex; }
    .wa-main { margin-left:0; padding:20px 16px 110px; }
    .wa-hero-grid, .wa-feature-grid, .wa-grid-2, .wa-grid-3, .wa-stats { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

const pad = (n) => String(n).padStart(2, "0");
const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const addDays = (d, n) => { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; };
const startOfDay = (d) => { const nd = new Date(d); nd.setHours(0, 0, 0, 0); return nd; };
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
const WEEKDAY_LETTER = ["S", "M", "T", "W", "T", "F", "S"];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function emptyDay() { return { workoutDone: false, workoutCategory: null, habits: {}, water: 0, sleep: null, journal: null }; }

function computeDayScore(day, profile) {
  if (!day) return 0;
  const workoutScore = day.workoutDone ? 25 : 0;
  const habitIds = (profile?.habits || []).map((h) => h.id);
  const total = habitIds.length || 1;
  const checked = habitIds.filter((id) => day.habits && day.habits[id]).length;
  const habitsScore = habitIds.length ? Math.round((checked / total) * 25) : 0;
  const waterGoal = profile?.waterGoal || 2500;
  const waterScore = Math.min(20, Math.round((day.water / waterGoal) * 20));
  const sleepTarget = profile?.sleepTarget || 8;
  const sleepScore = (day.sleep && day.sleep.hours) ? Math.min(30, Math.round((day.sleep.hours / sleepTarget) * 30)) : 0;
  return Math.min(100, workoutScore + habitsScore + waterScore + sleepScore);
}

function computeStreak(days, profile) {
  let streak = 0, cursor = new Date();
  if (computeDayScore(days[dateKey(cursor)], profile) === 0) cursor = addDays(cursor, -1);
  while (computeDayScore(days[dateKey(cursor)], profile) > 0) { streak++; cursor = addDays(cursor, -1); }
  return streak;
}

function computeBestStreak(days, profile) {
  const keys = Object.keys(days).filter((k) => computeDayScore(days[k], profile) > 0).sort();
  let best = 0, cur = 0, prev = null;
  keys.forEach((k) => {
    const d = new Date(k + "T00:00:00");
    if (prev && daysBetween(prev, d) === 1) cur++; else cur = 1;
    if (cur > best) best = cur;
    prev = d;
  });
  return best;
}

function xpFromState(days, profile) {
  let xp = 0;
  Object.values(days).forEach((day) => {
    if (day.workoutDone) xp += 20;
    const habitIds = (profile?.habits || []).map((h) => h.id);
    xp += habitIds.filter((id) => day.habits && day.habits[id]).length * 5;
    if (day.water >= (profile?.waterGoal || 2500)) xp += 10;
    if (day.sleep && day.sleep.hours) xp += 10;
  });
  return xp;
}

let _audioCtx = null;
function beep(freq = 880, dur = 0.15, delay = 0) {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === "suspended") _audioCtx.resume();
    const t = _audioCtx.currentTime + delay;
    const o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
    o.connect(g); g.connect(_audioCtx.destination);
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}

/* ============================== ANIMATION HOOKS ============================== */
function useAnimatedNumber(target, duration = 900) {
  const [value, setValue] = useState(target);
  const fromRef = useRef(target);
  useEffect(() => {
    fromRef.current = value;
    let start = null, raf;
    const step = (ts) => {
      if (!start) start = ts;
      const t = Math.min(1, (ts - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setValue(fromRef.current + (target - fromRef.current) * eased);
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return value;
}
function useReducedMotion() {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    try {
      const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
      setReduced(mq.matches);
      const fn = (e) => setReduced(e.matches);
      mq.addEventListener && mq.addEventListener("change", fn);
      return () => mq.removeEventListener && mq.removeEventListener("change", fn);
    } catch (e) {}
  }, []);
  return reduced;
}
function useInView(options) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setInView(true); obs.disconnect(); }
    }, options || { threshold: 0.15 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}
function SectionReveal({ children, delay = 0 }) {
  const [ref, inView] = useInView();
  return (
    <div ref={ref} style={{
      opacity: inView ? 1 : 0,
      transform: inView ? "translateY(0)" : "translateY(28px)",
      transition: `opacity .7s ease ${delay}s, transform .7s ease ${delay}s`,
    }}>{children}</div>
  );
}

function Heatmap({ days, profile, startDate, dayIndex }) {
  const start = new Date(startDate + "T00:00:00");
  const cells = Array.from({ length: ARC_LENGTH }).map((_, i) => {
    const d = addDays(start, i), k = dateKey(d);
    const score = computeDayScore(days[k], profile);
    const future = i + 1 > dayIndex;
    return { k, score, future, day: i + 1 };
  });
  const colorFor = (c) => {
    if (c.future) return "transparent";
    if (c.score >= 100) return "#8FE1FF";
    if (c.score >= 70) return "rgba(127,214,255,0.75)";
    if (c.score >= 40) return "rgba(127,214,255,0.42)";
    if (c.score > 0) return "rgba(127,214,255,0.18)";
    return "rgba(255,255,255,0.05)";

/* ============================== REST TIMER ============================== */
function RestTimer({ seconds, soundOn, onEnd, onClose }) {
  const [left, setLeft] = useState(seconds);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused || left <= 0) return;
    const t = setTimeout(() => setLeft((l) => l - 1), 1000);
    return () => clearTimeout(t);
  }, [paused, left]);
  useEffect(() => {
    if (left <= 0 && !paused) {
      if (soundOn) { beep(880, 0.18); beep(1175, 0.22, 0.18); }
      const t = setTimeout(onEnd, 600);
      return () => clearTimeout(t);
    }
  }, [left, paused]);
  const frac = clamp(left / seconds, 0, 1);
  const r = 30, c = 2 * Math.PI * r;
  const mm = Math.floor(left / 60), ss = left % 60;
  return (
    <Glass style={{ padding: "14px 18px", display: "flex", alignItems: "center", gap: 16, borderRadius: 16, animation: "wa-popin .25s ease both" }}>
      <div style={{ position: "relative", width: 76, height: 76, flexShrink: 0, animation: "wa-pulse 1.6s ease-in-out infinite" }}>
        <svg width="76" height="76" viewBox="0 0 76 76">
          <circle cx="38" cy="38" r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="6" />
          <circle cx="38" cy="38" r={r} fill="none" stroke="#8FE1FF" strokeWidth="6" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={c * (1 - frac)} transform="rotate(-90 38 38)" style={{ transition: "stroke-dashoffset 1s linear" }} />
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 14.5, color: "#F2F8FC" }}>
          {mm > 0 ? `${mm}:${pad(ss)}` : left}
        </div>
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 10.5, letterSpacing: 2, color: "#6E8296" }}>REST</div>
        <div style={{ fontSize: 14, color: "#EAF4FB", fontWeight: 600, marginTop: 2 }}>Breathe. Next set incoming.</div>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <Button size="sm" variant="secondary" icon={paused ? Play : Pause} onClick={() => setPaused(!paused)}>{paused ? "Resume" : "Pause"}</Button>
        <Button size="sm" variant="ghost" icon={SkipForward} onClick={onClose}>Skip</Button>
      </div>
    </Glass>
  );
}

  const h = Math.floor(hours), m = Math.round((hours - h) * 60);
  return (
    <div className="wa-overlay" style={{ position: "fixed", inset: 0, background: "rgba(3,5,8,0.72)", backdropFilter: "blur(4px)", zIndex: 130, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <div className="wa-modalcard" onClick={(e) => e.stopPropagation()}>
        <Glass style={{ padding: 26, width: 400, maxWidth: "90vw" }}>
          <div style={{ fontSize: 11, letterSpacing: 2, color: "#6E8296" }}>LAST NIGHT</div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 34, color: "#F2F8FC", marginTop: 6 }}>
            {h}h {m > 0 ? `${m}m` : ""}
          </div>
          <input type="range" min="4" max="10" step="0.25" value={hours} onChange={(e) => setHours(Number(e.target.value))} style={{ marginTop: 14 }} />
          <div style={{ marginTop: 22, marginBottom: 10, fontSize: 12.5, color: "#9FB4C6" }}>How did it feel?</div>
          <div style={{ display: "flex", gap: 8 }}>
            {[1, 2, 3, 4, 5].map((q) => (
              <button key={q} className="wa-btn" onClick={() => setQuality(q)}
                style={{ flex: 1, padding: "10px 0", borderRadius: 10, cursor: "pointer", fontSize: 13,
                  background: quality === q ? "rgba(127,214,255,0.18)" : "rgba(255,255,255,0.05)",
                  border: `1px solid ${quality === q ? "rgba(127,214,255,0.55)" : "rgba(255,255,255,0.1)"}`,
                  color: quality === q ? "#EAF4FB" : "#6E8296", fontWeight: quality === q ? 700 : 400 }}>
                {q}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 24, justifyContent: "flex-end" }}>
            <Button variant="ghost" size="sm" onClick={onClose}>Cancel</Button>
            <Button size="sm" icon={Moon} onClick={() => onSave({ hours, quality })}>Save</Button>
          </div>
        </Glass>
      </div>
    </div>
  );
}

function SessionPlayer({ category, def, prefillDone, soundOn, onFinish, onClose }) {
  const [done, setDone] = useState(prefillDone || {});
  const [rest, setRest] = useState(null);
  const toggleSet = (ei, si) => {
    const ex = def.exercises[ei];
    const arr = [...(done[ei] || Array(ex.sets).fill(false))];
    arr[si] = !arr[si];
    setDone({ ...done, [ei]: arr });
    if (arr[si] && ex.rest > 0) setRest({ secs: ex.rest });
  };
  const totalSets = def.exercises.reduce((a, e) => a + e.sets, 0);
  const doneCount = Object.values(done).reduce((a, arr) => a + (arr || []).filter(Boolean).length, 0);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 150, background: "#05070A", overflow: "auto" }}>
      <SnowField count={14} />
      <div style={{ position: "relative", zIndex: 1, maxWidth: 680, margin: "0 auto", padding: "26px 22px 140px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: 2, color: "#6E8296" }}>ACTIVE SESSION</div>
            <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 26, color: "#F2F8FC", marginTop: 4 }}>{category}</div>
            <div style={{ fontSize: 12, color: "#8FA4B8", marginTop: 4 }}>{def.muscles} · {def.duration} min · <span style={{ color: DIFF_COLOR[def.difficulty] }}>{def.difficulty}</span></div>
          </div>
          <button onClick={onClose} aria-label="close" style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, color: "#8FA4B8", cursor: "pointer", padding: 8 }}><X size={18} /></button>
        </div>
        <div style={{ marginBottom: 22 }}>
          <ProgressBar percent={(doneCount / totalSets) * 100} height={7} />
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 7, fontSize: 11, color: "#6E8296", fontFamily: "'JetBrains Mono',monospace" }}>
            <span>{doneCount} / {totalSets} SETS</span><span>{Math.round((doneCount / totalSets) * 100)}%</span>
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {def.exercises.map((ex, ei) => (
            <Glass key={ex.name} style={{ padding: 18 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
                <div style={{ display: "flex", gap: 10, alignItems: "baseline" }}>
                  <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12, color: "#5C7082" }}>{pad(ei + 1)}</span>
                  <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15.5, color: "#EAF4FB" }}>{ex.name}</span>
                </div>
                <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12.5, color: "#8FA4B8", flexShrink: 0 }}>{ex.sets} × {ex.reps}{ex.rest > 0 ? ` · ${ex.rest}s rest` : ""}</span>
              </div>
              <div style={{ display: "flex", gap: 9, marginTop: 14, flexWrap: "wrap" }}>
                {Array.from({ length: ex.sets }).map((_, si) => {
                  const isDone = done[ei] && done[ei][si];
                  return (
                    <button key={si} className={`wa-setdot ${isDone ? "done" : ""}`} onClick={() => toggleSet(ei, si)} aria-label={`set ${si + 1}`}>
                      {isDone ? <Check size={14} /> : si + 1}
                    </button>
                  );
                })}
              </div>
            </Glass>
          ))}
        </div>
      </div>

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, padding: "16px 22px calc(16px + env(safe-area-inset-bottom))", background: "linear-gradient(to top, #05070A 65%, rgba(5,7,10,0))", zIndex: 2 }}>
        <div style={{ maxWidth: 680, margin: "0 auto" }}>
          {rest ? (
            <RestTimer seconds={rest.secs} soundOn={soundOn} onEnd={() => setRest(null)} onClose={() => setRest(null)} />
          ) : (
            <Button size="lg" icon={CheckCircle2} onClick={onFinish} style={{ width: "100%" }}>
              FINISH SESSION
            </Button>
          )}
        </div>
      </div>
    </div>
  );
}

      </div>

      <Glass style={{ padding: 22 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 16 }}>
          <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: "#EAF4FB" }}>The arc so far</span>
          <span style={{ fontSize: 11.5, color: "#6E8296", fontFamily: "'JetBrains Mono',monospace" }}>{stats.activeDays}/{ARC_LENGTH} ACTIVE</span>
        </div>
        <Heatmap days={state.days} profile={profile} startDate={profile.startDate} dayIndex={stats.dayIndex} />
      </Glass>
    </div>
  );
}

function JournalPage({ state, api }) {
  const today = state.days[todayKey()] || emptyDay();
  const j = today.journal;
  const [mood, setMood] = useState(j ? j.mood : null);
  const [energy, setEnergy] = useState(j ? j.energy : 6);
  const [notes, setNotes] = useState(j ? j.notes : "");
  useEffect(() => { setMood(j ? j.mood : null); setEnergy(j ? j.energy : 6); setNotes(j ? j.notes : ""); }, [j && j.ts]);
  const entries = Object.keys(state.days)
    .filter((k) => k !== todayKey() && state.days[k].journal)
    .sort((a, b) => (a < b ? 1 : -1))
    .map((k) => ({ k, ...state.days[k].journal }));
  return (
    <div className="wa-fadein">
      <PageHead eyebrow="REFLECTION" title="Journal" sub="One honest paragraph a day beats an hour of overthinking." />
      <Glass style={{ padding: 22, marginBottom: 16 }}>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: "#EAF4FB", marginBottom: 16 }}>Today's entry</div>
        <div style={{ fontSize: 12, color: "#6E8296", marginBottom: 8 }}>Mood</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
          {MOODS.map((m) => <Chip key={m} label={m} selected={mood === m} onClick={() => setMood(m)} compact />)}
        </div>
        <div style={{ fontSize: 12, color: "#6E8296", marginBottom: 8 }}>Energy — <span style={{ fontFamily: "'JetBrains Mono',monospace", color: "#EAF4FB" }}>{energy}/10</span></div>
        <input type="range" min="1" max="10" value={energy} onChange={(e) => setEnergy(Number(e.target.value))} style={{ marginBottom: 18 }} />
        <textarea className="wa-input" rows="4" placeholder="What worked today? What's next?" value={notes} onChange={(e) => setNotes(e.target.value)} />
        <div style={{ marginTop: 14 }}>
          <Button icon={BookOpen} onClick={() => api.saveJournal({ mood, energy, notes })}>{j ? "UPDATE ENTRY" : "SAVE ENTRY"}</Button>
        </div>
      </Glass>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {entries.length === 0 && <div style={{ fontSize: 13, color: "#6E8296", padding: "8px 2px" }}>Past entries will appear here.</div>}
        {entries.map((e) => (
          <Glass key={e.k} style={{ padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12.5, color: "#8FA4B8" }}>{e.k}</span>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                {e.mood && <span style={{ fontSize: 11, padding: "3px 10px", borderRadius: 99, background: "rgba(127,214,255,0.1)", color: "#8FD4FF", border: "1px solid rgba(127,214,255,0.25)" }}>{e.mood}</span>}
                <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, color: "#6E8296" }}>{e.energy}/10</span>
              </div>
            </div>
            {e.notes && <div style={{ fontSize: 13.5, color: "#C6D6E2", marginTop: 10, lineHeight: 1.6 }}>{e.notes}</div>}
          </Glass>
        ))}
      </div>
    </div>
  );
}

function ChallengesPage({ state, stats }) {
  return (
    <div className="wa-fadein">
      <PageHead eyebrow="LONG GAME" title="Challenges" sub="Optional quests for when the daily grind needs a bigger mountain." />
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {CHALLENGE_DEFS.map((c) => {
          const val = Math.min(c.target, c.get(stats, state));
          const done = val >= c.target;
          const pct = Math.round((val / c.target) * 100);
          return (
            <Glass key={c.id} style={{ padding: 20, border: done ? "1px solid rgba(110,231,198,0.35)" : undefined }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  {done ? <CheckCircle2 size={20} color="#6EE7C6" /> : <Target size={18} color="#79D6FF" />}
                  <div>
                    <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: done ? "#EAF4FB" : "#EAF4FB" }}>{c.name}</div>
                    <div style={{ fontSize: 12.5, color: "#8FA4B8", marginTop: 2 }}>{c.desc}</div>
                  </div>
                </div>
                <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12.5, color: done ? "#6EE7C6" : "#8FA4B8", flexShrink: 0 }}>{val}/{c.target}</span>
              </div>
              <ProgressBar percent={pct} color={done ? "#6EE7C6" : "linear-gradient(90deg,#79D6FF,#5B8CFF)"} height={6} />
            </Glass>
          );
        })}
      </div>
    </div>
  );
}

function AwardsPage({ state, stats }) {
  const unlocked = Object.keys(state.achievements).length;
  return (
    <div className="wa-fadein">
      <PageHead eyebrow="MILESTONES" title="Achievements" sub={`${unlocked} of ${ACHIEVEMENT_DEFS.length} unlocked · ${stats.xp} XP · LV ${stats.level} — ${RANKS[Math.min(RANKS.length - 1, stats.level - 1)]}`} />
      <div className="wa-grid-3">
        {ACHIEVEMENT_DEFS.map((a) => {
          const when = state.achievements[a.id];
          return (
            <Glass key={a.id} style={{ padding: 22, opacity: when ? 1 : 0.55, border: when ? "1px solid rgba(143,225,255,0.3)" : undefined, textAlign: "center" }}>
              <div style={{ width: 54, height: 54, borderRadius: 16, margin: "0 auto 14px", display: "flex", alignItems: "center", justifyContent: "center",
                background: when ? "rgba(127,214,255,0.14)" : "rgba(255,255,255,0.05)" }}>
                {when ? <Trophy size={24} color="#8FE1FF" /> : <Lock size={20} color="#5C7082" />}
              </div>
              <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 14, letterSpacing: 1.5, color: when ? "#F2F8FC" : "#6E8296" }}>{a.name}</div>
              <div style={{ fontSize: 12.5, color: "#8FA4B8", marginTop: 6, lineHeight: 1.5 }}>{a.desc}</div>
              {when && <div style={{ fontSize: 11, color: "#6EE7C6", marginTop: 10, fontFamily: "'JetBrains Mono',monospace" }}>UNLOCKED {when}</div>}
            </Glass>
          );
        })}
      </div>
    </div>
  );
}

function SettingsPage({ state, api }) {
  const profile = state.profile;
  const [newHabit, setNewHabit] = useState("");
  const fileRef = useRef(null);
  return (
    <div className="wa-fadein">
      <PageHead eyebrow="CONTROL" title="Settings" sub="Your arc, your rules." />

      <div className="wa-grid-2" style={{ marginBottom: 16 }}>
        <Glass style={{ padding: 22 }}>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: "#EAF4FB", marginBottom: 16 }}>Profile</div>
          <div style={{ fontSize: 12, color: "#6E8296", marginBottom: 7 }}>Name</div>
          <input className="wa-input" value={profile.name} onChange={(e) => api.updateProfile({ name: e.target.value })} style={{ marginBottom: 16 }} />
          <div style={{ display: "flex", gap: 20, fontSize: 13, color: "#8FA4B8" }}>
            <span>Age: <b style={{ color: "#EAF4FB" }}>{profile.age || "—"}</b></span>
            <span>Level: <b style={{ color: "#EAF4FB" }}>{profile.experience}</b></span>
          </div>
          <div style={{ marginTop: 14, fontSize: 12, color: "#6E8296" }}>Arc started <b style={{ color: "#8FA4B8", fontFamily: "'JetBrains Mono',monospace" }}>{profile.startDate}</b></div>
        </Glass>

        <Glass style={{ padding: 22 }}>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: "#EAF4FB", marginBottom: 16 }}>Daily targets</div>
          <div style={qlabel}>Water goal — <span style={{ color: "#EAF4FB", fontFamily: "'JetBrains Mono',monospace" }}>{(profile.waterGoal / 1000).toFixed(1)}L</span></div>
          <input type="range" min="1500" max="4000" step="250" value={profile.waterGoal} onChange={(e) => api.updateProfile({ waterGoal: Number(e.target.value) })} style={{ marginBottom: 20 }} />
          <div style={qlabel}>Sleep target — <span style={{ color: "#EAF4FB", fontFamily: "'JetBrains Mono',monospace" }}>{profile.sleepTarget}h</span></div>
          <input type="range" min="5" max="10" step="0.5" value={profile.sleepTarget} onChange={(e) => api.updateProfile({ sleepTarget: Number(e.target.value) })} />
        </Glass>
      </div>

      <Glass style={{ padding: 22, marginBottom: 16 }}>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: "#EAF4FB", marginBottom: 14 }}>Habits</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
          {profile.habits.map((h) => (
            <span key={h.id} style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "7px 8px 7px 13px", borderRadius: 10, background: "rgba(127,214,255,0.08)", border: "1px solid rgba(127,214,255,0.25)", fontSize: 13, color: "#EAF4FB" }}>
              {h.name}
              <button onClick={() => api.removeHabit(h.id)} aria-label={`remove ${h.name}`} style={{ background: "none", border: "none", color: "#6E8296", cursor: "pointer", display: "flex", padding: 2 }}><X size={13} /></button>
            </span>
          ))}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <input className="wa-input" placeholder="Add a custom habit…" value={newHabit} onChange={(e) => setNewHabit(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && newHabit.trim()) { api.addHabit(newHabit.trim()); setNewHabit(""); } }} />
          <Button icon={Plus} onClick={() => { if (newHabit.trim()) { api.addHabit(newHabit.trim()); setNewHabit(""); } }}>Add</Button>
        </div>
      </Glass>

      <div className="wa-grid-2">
        <Glass style={{ padding: 22 }}>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: "#EAF4FB", marginBottom: 14 }}>Sound cues</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, color: "#8FA4B8", fontSize: 13.5 }}>
              {state.settings.sound ? <Volume2 size={16} color="#79D6FF" /> : <VolumeX size={16} />}
              Rest-timer beeps {state.settings.sound ? "on" : "off"}
            </div>
            <Switch on={state.settings.sound} onToggle={api.toggleSound} />
          </div>
        </Glass>

        <Glass style={{ padding: 22 }}>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 15, color: "#EAF4FB", marginBottom: 14 }}>Data</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <Button size="sm" variant="secondary" icon={Download} onClick={api.doExport}>Export</Button>
            <Button size="sm" variant="secondary" onClick={() => fileRef.current && fileRef.current.click()}>Import</Button>
            <Button size="sm" variant="danger" icon={Trash2} onClick={api.askReset}>Reset arc</Button>
          </div>
          <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={api.onImport} />
          <div style={{ fontSize: 11.5, color: "#5C7082", marginTop: 12 }}>Everything is stored locally in your browser. Export gives you a JSON backup.</div>
        </Glass>
      </div>
    </div>
  );
}

/* ============================== APP SHELL ============================== */
const NAV = [
  { id: "today", label: "Today", icon: Home },
  { id: "train", label: "Training", icon: Dumbbell },
  { id: "progress", label: "Progress", icon: TrendingUp },
  { id: "journal", label: "Journal", icon: BookOpen },
  { id: "challenges", label: "Challenges", icon: Target },
  { id: "awards", label: "Achievements", icon: Trophy },
  { id: "settings", label: "Settings", icon: SettingsIcon },
];
const NAV_MOB = ["today", "train", "progress", "awards", "settings"];

function App() {
  const [state, setState] = useState(loadState);
  const [showOnboarding, setShowOnboarding] = useState(false);
  const [page, setPage] = useState("today");
  const [toast, setToast] = useState(null);
  const [confirmState, setConfirmState] = useState(null);
  const [burst, setBurst] = useState(null);
  const [session, setSession] = useState(null);
  const [picker, setPicker] = useState(false);
  const [sleepModal, setSleepModal] = useState(false);
  const exploreRef = useRef(null);
  const prevScoreRef = useRef(null);
  const mountedRef = useRef(false);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }, [state]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2600);
    return () => clearTimeout(t);
  }, [toast]);
  const showToast = useCallback((msg) => setToast({ msg }), []);
  const celebrate = useCallback((title) => setBurst({ n: Date.now(), title }), []);

  const patchDay = useCallback((key, patch) => {
    setState((s) => ({ ...s, days: { ...s.days, [key]: { ...emptyDay(), ...s.days[key], ...patch } } }));
  }, []);
  const updateProfile = useCallback((patch) => {
    setState((s) => ({ ...s, profile: { ...s.profile, ...patch } }));
  }, []);

  const today = state.days[todayKey()] || emptyDay();
  const stats = useMemo(() => {
    if (!state.profile) return { streak: 0, bestStreak: 0, activeDays: 0, workouts: 0, xp: 0, level: 1, dayIndex: 1, score: 0 };
    const streak = computeStreak(state.days, state.profile);
    const bestStreak = computeBestStreak(state.days, state.profile);
    const activeDays = Object.keys(state.days).filter((k) => computeDayScore(state.days[k], state.profile) > 0).length;
    const workouts = Object.values(state.days).filter((d) => d.workoutDone).length;
    const xp = xpFromState(state.days, state.profile);
    const level = Math.floor(xp / XP_PER_LEVEL) + 1;
    const dayIndex = Math.min(ARC_LENGTH, Math.max(1, daysBetween(new Date(state.profile.startDate + "T00:00:00"), new Date()) + 1));
    const score = computeDayScore(state.days[todayKey()], state.profile);
    return { streak, bestStreak, activeDays, workouts, xp, level, dayIndex, score };
  }, [state]);

  // achievements: unlock + toast
  useEffect(() => {
    if (!state.onboarded) return;
    const newly = ACHIEVEMENT_DEFS.filter((a) => !state.achievements[a.id] && a.check(stats));
    if (newly.length) {
      const ach = { ...state.achievements };
      newly.forEach((a) => { ach[a.id] = todayKey(); });
      setState((s) => ({ ...s, achievements: ach }));
      newly.forEach((a, i) => {
        setTimeout(() => { showToast(`Achievement unlocked — ${a.name}`); celebrate(i === newly.length - 1 ? a.name : null); }, i * 700);
      });
    }
  }, [stats]);

  // perfect day celebration
  useEffect(() => {
    if (!mountedRef.current) { mountedRef.current = true; prevScoreRef.current = stats.score; return; }
    if (state.onboarded && prevScoreRef.current < 100 && stats.score >= 100) {
      celebrate("PERFECT DAY");
      showToast("Perfect day. 100 points.");
    }
    prevScoreRef.current = stats.score;
  }, [stats.score, state.onboarded]);

  const api = {
    openPicker: () => setPicker(true),
    openSleep: () => setSleepModal(true),
    startSession: (cat) => setSession({ category: cat }),
    toggleHabit: (id) => patchDay(todayKey(), { habits: { ...today.habits, [id]: !today.habits[id] } }),
    addWater: (ml) => patchDay(todayKey(), { water: Math.max(0, today.water + ml) }),
    saveJournal: (j) => { patchDay(todayKey(), { journal: { ...j, ts: Date.now() } }); showToast("Journal saved."); },
    updateProfile,
    addHabit: (name) => { if (!name.trim()) return; updateProfile({ habits: [...state.profile.habits, { id: "c" + Date.now(), name }] }); showToast("Habit added."); },
    removeHabit: (h) => updateProfile({ habits: state.profile.habits.filter((x) => x.id !== h.id) }),
    toggleSound: () => setState((s) => ({ ...s, settings: { ...s.settings, sound: !s.settings.sound } })),
    doExport: () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "winter-arc-data.json"; a.click();
      URL.revokeObjectURL(url);
      showToast("Data exported.");
    },
    onImport: (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const p = JSON.parse(r.result);
          if (p && p.profile && p.days && p.settings) { setState(p); showToast("Data imported."); }
          else showToast("Invalid file.");
        } catch (err) { showToast("Could not read file."); }
      };
      r.readAsText(f);
      e.target.value = "";
    },
    askReset: () => setConfirmState({
      title: "Reset everything?",
      body: "This wipes your entire arc — profile, days, journal, achievements. There is no undo.",
      danger: true, confirmLabel: "Wipe it",
      onConfirm: () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        setState(defaultState());
        setPage("today");
        showToast("Arc reset. Begin again.");
      },
    }),
  };

  const finishWorkout = (category) => {
    patchDay(todayKey(), { workoutDone: true, workoutCategory: category });
    setSession(null);
    if (state.settings.sound) beep(660, 0.12);
    showToast(`${category} logged. +20 XP`);
  };

  if (!state.onboarded && !showOnboarding) {
    return (
      <>
        <Landing
          onStart={() => setShowOnboarding(true)}
          onExplore={() => exploreRef.current && exploreRef.current.scrollIntoView({ behavior: "smooth" })}
          exploreRef={exploreRef}
        />
        <Toast toast={toast} />
      </>
    );
  }
  if (showOnboarding && !state.onboarded) {
    return (
      <Onboarding
        onCancel={() => setShowOnboarding(false)}
        onComplete={(profile) => {
          setState({ ...defaultState(), onboarded: true, profile: { ...profile, startDate: todayKey() } });
          setShowOnboarding(false);
          celebrate("THE ARC BEGINS");
        }}
      />
    );
  }

  const pageProps = { state, stats, api };
  const PageComp = { today: TodayPage, train: TrainPage, progress: ProgressPage, journal: JournalPage, challenges: ChallengesPage, awards: AwardsPage, settings: SettingsPage }[page];
  const xpInto = stats.xp % XP_PER_LEVEL;

  return (
    <div>
      <SnowField count={16} />

      <aside className="wa-sidebar">
        <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "4px 10px 20px" }}>
          <Snowflake size={18} color="#79D6FF" />
          <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, letterSpacing: 2.5, fontSize: 12.5, color: "#EAF4FB" }}>WINTER ARC</span>
        </div>
        {NAV.map((n) => (
          <button key={n.id} className={`wa-navitem ${page === n.id ? "active" : ""}`} onClick={() => setPage(n.id)}>
            <n.icon size={16} />{n.label}
          </button>
        ))}
        <Glass style={{ padding: 14, marginTop: "auto", borderRadius: 14 }}>
          <div style={{ fontSize: 10.5, color: "#6E8296", letterSpacing: 1 }}>RANK</div>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 13.5, color: "#EAF4FB", marginTop: 3 }}>
            {RANKS[Math.min(RANKS.length - 1, stats.level - 1)]}
          </div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10.5, color: "#8FA4B8", margin: "8px 0 6px" }}>
            LV {stats.level} · {stats.xp} XP
          </div>
          <ProgressBar percent={(xpInto / XP_PER_LEVEL) * 100} height={5} />
        </Glass>
      </aside>

      <nav className="wa-mobilenav">
        {NAV_MOB.map((id) => {
          const n = NAV.find((x) => x.id === id);
          return (
            <button key={id} className={page === id ? "active" : ""} onClick={() => setPage(id)}>
              <n.icon size={19} /><span>{n.label}</span>
            </button>
          );
        })}
      </nav>

      <main className="wa-main">
        <div className="wa-main-inner">
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
            <StatChip icon={Flame} color="#F5B971">{stats.streak}d streak</StatChip>
            <StatChip icon={Snowflake} color="#8FE1FF">DAY {stats.dayIndex}/{ARC_LENGTH}</StatChip>
            <StatChip icon={Zap} color="#6EE7C6">{stats.score}% today</StatChip>
          </div>
          <PageComp {...pageProps} />
        </div>
      </main>

      {picker && (
        <WorkoutPicker
          onClose={() => setPicker(false)}
          onPick={(cat) => { setPicker(false); setSession({ category: cat }); }}
        />
      )}
      {sleepModal && (
        <SleepModal
          initial={today.sleep}
          onClose={() => setSleepModal(false)}
          onSave={(sleep) => { patchDay(todayKey(), { sleep }); setSleepModal(false); showToast("Sleep logged."); }}
        />
      )}
      {session && (
        <SessionPlayer
          category={session.category}
          def={WORKOUT_LIBRARY[session.category]}
          prefillDone={today.workoutDone && today.workoutCategory === session.category
            ? Object.fromEntries(WORKOUT_LIBRARY[session.category].exercises.map((e, i) => [i, Array(e.sets).fill(true)]))
            : {}}
          soundOn={state.settings.sound}
          onFinish={() => finishWorkout(session.category)}
          onClose={() => setSession(null)}
        />
      )}
      <ConfirmDialog
        open={!!confirmState}
        title={confirmState && confirmState.title}
        body={confirmState && confirmState.body}
        danger={confirmState && confirmState.danger}
        confirmLabel={confirmState && confirmState.confirmLabel}
        onCancel={() => setConfirmState(null)}
        onConfirm={() => { if (confirmState && confirmState.onConfirm) confirmState.onConfirm(); setConfirmState(null); }}
      />
      <Toast toast={toast} />
      {burst && <SnowBurst key={burst.n} title={burst.title} onDone={() => setBurst(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
